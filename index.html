<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BIDUL</title>
    <!-- 아이콘 설정 -->
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="icon.png" type="image/png">
    <link rel="apple-touch-icon" href="icon.png">

    <!-- Ponytail 라이브러리 연동 -->
    <script src="https://cdn.jsdelivr.net/gh/dietrichgebert/ponytail@main/ponytail.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=Noto+Serif+KR:wght@400;700&family=Nanum+Gothic:wght@400;700&display=swap');

        /* 테마 변수 설정 (라이트 / 다크모드) */
        :root {
            --bg-main: #f4f4f4;
            --bg-paper: #ffffff;
            --text-main: #111111;
            --text-sub: #555555;
            --text-muted: #bbbbbb;
            --border-light: #eeeeee;
            --border-main: #e5e5e5;
            --border-dark: #dcdcdc;
            --hover-bg: #f9f9f9;
            --btn-pub-bg: #555555;
            --btn-pub-text: #ffffff;
            --shadow: rgba(0,0,0,0.05);
            --modal-overlay: rgba(0,0,0,0.5);
        }

        .dark-mode {
            --bg-main: #121212;
            --bg-paper: #1e1e1e;
            --text-main: #eeeeee;
            --text-sub: #aaaaaa;
            --text-muted: #666666;
            --border-light: #2a2a2a;
            --border-main: #333333;
            --border-dark: #444444;
            --hover-bg: #2a2a2a;
            --btn-pub-bg: #888888;
            --btn-pub-text: #111111;
            --shadow: rgba(0,0,0,0.5);
            --modal-overlay: rgba(0,0,0,0.7);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            transition: background-color 0.3s, color 0.3s;
        }

        .fixed-header {
            position: fixed; top: 0; left: 0; right: 0;
            z-index: 1000; background: var(--bg-paper);
            transition: background-color 0.3s;
        }

        .toolbar-row-1 {
            display: flex; align-items: center; justify-content: space-between;
            height: 54px; padding: 0 20px; border-bottom: 1px solid var(--border-main);
        }
        .logo-area { display: flex; align-items: center; gap: 8px; cursor: pointer; }
        .logo-img { width: 28px; height: 28px; object-fit: cover; }
        .logo-text { font-size: 20px; font-weight: 900; color: var(--text-main); letter-spacing: 1px; }

        .action-buttons { display: flex; align-items: center; gap: 8px; }

        .menu-container { position: relative; display: inline-block; }
        .icon-btn {
            background: none; border: none; cursor: pointer;
            color: var(--text-sub); padding: 5px;
            display: flex; align-items: center; justify-content: center;
        }
        .icon-btn:hover { color: var(--text-main); }
        
        .dropdown {
            display: none; position: absolute; top: 100%; right: 0; margin-top: 8px;
            background: var(--bg-paper); border: 1px solid var(--border-main);
            box-shadow: 0 4px 12px var(--shadow); min-width: 150px; z-index: 2000;
        }
        .dropdown.show { display: block; }
        .dropdown-item {
            padding: 12px 16px; font-size: 13px; color: var(--text-main);
            cursor: pointer; border-bottom: 1px solid var(--border-light); font-weight: 500;
        }
        .dropdown-item:last-child { border-bottom: none; }
        .dropdown-item:hover { background: var(--hover-bg); }

        .btn {
            padding: 6px 16px; font-size: 13px; font-weight: 500; cursor: pointer;
            border-radius: 0; border: 1px solid var(--border-dark); font-family: inherit; transition: all 0.2s;
        }
        .btn-save { background: var(--bg-paper); color: var(--text-main); }
        .btn-save:hover { background: var(--hover-bg); }
        .btn-publish { background: var(--btn-pub-bg); color: var(--btn-pub-text); border-color: var(--btn-pub-bg); }
        .btn-publish:hover { opacity: 0.8; }

        .toolbar-row-2 {
            display: flex; align-items: center; height: 70px; padding: 0 15px;
            border-bottom: 1px solid var(--border-light); gap: 2px;
        }
        .tool-btn {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            width: 58px; height: 58px; background: none; border: none; cursor: pointer; color: var(--text-sub);
            border-radius: 0;
        }
        .tool-btn:hover { background-color: var(--hover-bg); color: var(--text-main); }
        .tool-btn svg { width: 22px; height: 22px; margin-bottom: 4px; stroke-width: 1.5; }
        .tool-btn span { font-size: 11px; }

        .toolbar-row-3 {
            display: flex; align-items: center; height: 38px; padding: 0 20px;
            border-bottom: 1px solid var(--border-main); gap: 15px;
        }
        .font-select, .size-select {
            border: none; outline: none; -webkit-appearance: none;
            background: transparent; padding-right: 5px; font-size: 13px; color: var(--text-sub); cursor: pointer;
            font-family: inherit;
        }
        .font-select option, .size-select option { background: var(--bg-paper); color: var(--text-main); }

        .editor-outer, .view-outer {
            margin-top: 162px; padding-bottom: 100px; display: flex; justify-content: center;
        }
        .view-outer { margin-top: 54px; }
        .editor-paper {
            width: 820px; min-height: 800px; background: var(--bg-paper); padding: 60px 80px;
            border: 1px solid var(--border-main); box-shadow: 0 2px 10px var(--shadow); transition: background-color 0.3s;
        }

        .title-area { width: 100%; margin-bottom: 30px; }
        .title-input {
            width: 100%; border: none; outline: none; font-size: 30px; font-weight: 500;
            color: var(--text-main); padding-bottom: 15px; font-family: inherit; background: transparent;
        }
        .title-input::placeholder { color: var(--text-muted); }
        .title-line { width: 100%; height: 1px; background: var(--border-light); }

        .content-editor {
            width: 100%; min-height: 600px; border: none; outline: none;
            font-size: 16px; line-height: 1.8; color: var(--text-main); word-break: break-all; background: transparent;
        }
        .content-editor:empty:before { content: attr(data-placeholder); color: var(--text-muted); }
        /* 이미지 파일을 에디터 위로 드래그할 때 삽입 위치를 알 수 있게 표시 */
        .content-editor.drag-over {
            outline: 2px dashed var(--text-sub);
            outline-offset: -8px;
            background-color: var(--hover-bg);
        }

        .media-container { margin: 25px 0; background: #000; line-height: 0; }
        .media-container video, .media-container iframe { width: 100%; display: block; outline: none; border: none; aspect-ratio: 16/9; }
        img { max-width: 100%; height: auto; margin: 20px 0; display: block; }

        /* ===== 접기/펼치기 블록 (박스 없음) ===== */
        .fold-block {
            margin: 12px 0;
        }
        .fold-header {
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            user-select: none;
            color: var(--text-main);
            font-weight: 700;
            list-style: none;
        }
        .fold-header::-webkit-details-marker { display: none; }
        .fold-header::marker { content: ''; }

        .fold-arrow {
            display: flex; align-items: center; justify-content: center;
            color: var(--text-sub);
            transition: transform 0.2s ease;
        }
        .fold-arrow svg { width: 16px; height: 16px; }

        /* 열렸을 때 화살표 회전 (▶ -> ▼) */
        details.fold-block[open] > .fold-header .fold-arrow {
            transform: rotate(90deg);
        }

        .fold-title {
            flex: 1; outline: none; border: none; background: transparent;
            font-size: inherit; color: inherit; font-family: inherit;
        }
        .fold-title:empty:before { content: attr(data-placeholder); color: var(--text-muted); font-weight: normal; }

        .fold-body {
            padding-left: 22px; /* 화살표 너비만큼 들여쓰기 */
            padding-top: 6px;
            font-size: 15px;
            line-height: 1.8;
            color: var(--text-sub);
        }
        .fold-body:empty:before { content: '내용을 입력하세요...'; color: var(--text-muted); }

        .content-editor .fold-block { user-select: text; }
        .content-editor .fold-title { cursor: text; }
        .content-editor .fold-body { min-height: 30px; }

        /* 홈 화면 */
        .home-container {
            margin-top: 54px; width: 820px; margin-left: auto; margin-right: auto;
            background: var(--bg-paper); min-height: 100vh; padding: 40px 60px; border: 1px solid var(--border-main);
        }
        .post-item { padding: 25px 0; border-bottom: 1px solid var(--border-light); cursor: pointer; }
        .post-title { font-size: 18px; font-weight: 500; margin-bottom: 8px; color: var(--text-main); }

        .modal-overlay {
            display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: var(--modal-overlay); z-index: 2000; align-items: center; justify-content: center;
        }
        .modal-overlay.show { display: flex; }
        .modal { background: var(--bg-paper); padding: 25px; width: 400px; border-radius: 0; }
        .modal h3 { color: var(--text-main); font-size: 16px; margin-bottom: 15px; }
        .modal-input { 
            width: 100%; padding: 10px; border: 1px solid var(--border-dark); margin-bottom: 20px; 
            outline: none; background: transparent; color: var(--text-main);
        }

        .hidden { display: none !important; }
        .toast {
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
            background: var(--text-main); color: var(--bg-paper); padding: 10px 20px; 
            font-size: 13px; z-index: 3000; display: none; font-weight: bold;
        }
    </style>
</head>
<body>

    <!-- 에디터 헤더 -->
    <div class="fixed-header hidden" id="writeHeader">
        <div class="toolbar-row-1">
            <div class="logo-area" onclick="goHome()">
                <img src="icon.png" class="logo-img" alt="BIDUL" onerror="this.src='https://cdn-icons-png.flaticon.com/512/3685/3685253.png'">
                <span class="logo-text">BIDUL</span>
            </div>
            <div class="action-buttons">
                <button class="btn btn-save" onclick="savePost()">저장</button>
                <button class="btn btn-publish" onclick="publishPost()">등록</button>
                <div class="menu-container">
                    <button class="icon-btn" onclick="toggleMenu(event, 'writeMenu')">
                        <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
                            <circle cx="12" cy="5" r="2"></circle>
                            <circle cx="12" cy="12" r="2"></circle>
                            <circle cx="12" cy="19" r="2"></circle>
                        </svg>
                    </button>
                    <div class="dropdown" id="writeMenu">
                        <div class="dropdown-item" onclick="toggleDarkMode()">다크모드 전환</div>
                        <div class="dropdown-item" onclick="exportCache()">캐시 내보내기</div>
                        <div class="dropdown-item" onclick="document.getElementById('importInput').click()">캐시 불러오기</div>
                    </div>
                </div>
            </div>
        </div>
        <div class="toolbar-row-2">
            <button class="tool-btn" onclick="insertImage()">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5" fill="currentColor"/><path d="M21 15l-5-5L5 21"/></svg>
                <span>사진</span>
            </button>
            <button class="tool-btn" onclick="insertVideo()">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M10 9l5 3-5 3V9z" fill="currentColor"/></svg>
                <span>영상</span>
            </button>
            <button class="tool-btn" onclick="openLinkModal()">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M10 13a5 5 0 007.54.54l3-3a5 5 0 00-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 00-7.54-.54l-3 3a5 5 0 007.07 7.07l1.71-1.71"/></svg>
                <span>링크</span>
            </button>
            <!-- 접기 기능 -->
            <button class="tool-btn" onclick="insertFoldBlock()">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="9 18 15 12 9 6"></polyline>
                </svg>
                <span>접기</span>
            </button>
        </div>
        <div class="toolbar-row-3">
            <select class="font-select" id="fontSelect" onchange="updateStyle()">
                <option value="'Nanum Gothic'">나눔고딕 ▾</option>
                <option value="'Noto Sans KR'">본고딕 ▾</option>
                <option value="serif">명조체 ▾</option>
            </select>
            <select class="size-select" id="sizeSelect" onchange="updateStyle()">
                <option value="13px">13 ▾</option>
                <option value="16px" selected>16 ▾</option>
                <option value="19px">19 ▾</option>
                <option value="24px">24 ▾</option>
            </select>
        </div>
    </div>

    <!-- 홈 헤더 -->
    <div class="fixed-header" id="homeHeader">
        <div class="toolbar-row-1">
            <div class="logo-area" onclick="goHome()">
                <img src="icon.png" class="logo-img" alt="BIDUL" onerror="this.src='https://cdn-icons-png.flaticon.com/512/3685/3685253.png'">
                <span class="logo-text">BIDUL</span>
            </div>
            <div class="action-buttons">
                <button class="btn btn-publish" onclick="goWrite()">글쓰기</button>
                <div class="menu-container">
                    <button class="icon-btn" onclick="toggleMenu(event, 'homeMenu')">
                        <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
                            <circle cx="12" cy="5" r="2"></circle>
                            <circle cx="12" cy="12" r="2"></circle>
                            <circle cx="12" cy="19" r="2"></circle>
                        </svg>
                    </button>
                    <div class="dropdown" id="homeMenu">
                        <div class="dropdown-item" onclick="toggleDarkMode()">다크모드 전환</div>
                        <div class="dropdown-item" onclick="exportCache()">캐시 내보내기</div>
                        <div class="dropdown-item" onclick="document.getElementById('importInput').click()">캐시 불러오기</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 글 보기 헤더 -->
    <div class="fixed-header hidden" id="viewHeader">
        <div class="toolbar-row-1">
            <div class="logo-area" onclick="goHome()">
                <img src="icon.png" class="logo-img" alt="BIDUL" onerror="this.src='https://cdn-icons-png.flaticon.com/512/3685/3685253.png'">
                <span class="logo-text">BIDUL</span>
            </div>
            <div class="action-buttons">
                <button class="btn btn-save" onclick="goHome()">목록</button>
                <!-- 수정 버튼 추가 -->
                <button class="btn btn-save" onclick="editPost()">수정</button>
                <button class="btn btn-publish" onclick="deletePost()" style="background:#cc0000; border-color:#cc0000;">삭제</button>
            </div>
        </div>
    </div>

    <!-- 에디터 영역 -->
    <div class="editor-outer hidden" id="writePage">
        <div class="editor-paper">
            <div class="title-area">
                <input type="text" class="title-input" id="titleInput" placeholder="제목을 입력하세요">
                <div class="title-line"></div>
            </div>
            <div class="content-editor" id="contentEditor" contenteditable="true" data-placeholder="내용을 입력하세요..."></div>
        </div>
    </div>

    <!-- 글 보기 영역 -->
    <div class="view-outer hidden" id="viewPage">
        <div class="editor-paper">
            <div class="title-area">
                <h1 id="viewTitle" style="font-size:30px; font-weight:500; color:var(--text-main); margin-bottom:10px;"></h1>
                <div id="viewDate" style="font-size:13px; color:var(--text-sub); margin-bottom:20px;"></div>
                <div class="title-line"></div>
            </div>
            <div class="content-editor" id="viewContent" contenteditable="false" style="min-height:auto;"></div>
        </div>
    </div>

    <!-- 홈 화면 -->
    <div class="home-container" id="homePage">
        <h2 style="margin-bottom:20px; font-weight:500; color:var(--text-main);">전체 글</h2>
        <div id="postList"></div>
    </div>

    <!-- 링크 모달 -->
    <div class="modal-overlay" id="linkModal">
        <div class="modal">
            <h3>링크 삽입</h3>
            <input type="text" class="modal-input" id="linkInput" placeholder="유튜브 주소 또는 웹 링크">
            <div style="display:flex; justify-content:flex-end; gap:8px;">
                <button class="btn btn-save" onclick="closeLinkModal()">취소</button>
                <button class="btn btn-publish" onclick="insertLink()">확인</button>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <input type="file" id="imageInput" accept="image/*" multiple hidden onchange="handleImage(event)">
    <input type="file" id="videoInput" accept="video/*" hidden onchange="handleVideo(event)">
    <input type="file" id="importInput" accept=".json" hidden onchange="importCache(event)">

    <script>
        // 글과 임시 저장은 localStorage 대신 IndexedDB에 저장합니다.
        // IndexedDB는 localStorage보다 큰 데이터를 저장할 수 있어 사진이 포함된 글에 적합합니다.
        let posts = [];
        let currentViewId = null;
        let editingPostId = null; // 수정 중인 글 ID
        let savedRange = null;
        let bidulDB = null;
        const BIDUL_DB_NAME = 'BIDUL_DATABASE';
        const BIDUL_DB_VERSION = 1;
        const BIDUL_STORE_NAME = 'appData';

        if (localStorage.getItem('bidul_darkmode') === 'true') document.body.classList.add('dark-mode');

        function openBidulDB() {
            return new Promise((resolve, reject) => {
                if (!('indexedDB' in window)) {
                    reject(new Error('이 브라우저는 IndexedDB를 지원하지 않습니다.'));
                    return;
                }
                const request = indexedDB.open(BIDUL_DB_NAME, BIDUL_DB_VERSION);
                request.onupgradeneeded = () => {
                    const database = request.result;
                    if (!database.objectStoreNames.contains(BIDUL_STORE_NAME)) {
                        database.createObjectStore(BIDUL_STORE_NAME, { keyPath: 'key' });
                    }
                };
                request.onsuccess = () => {
                    bidulDB = request.result;
                    bidulDB.onversionchange = () => bidulDB.close();
                    resolve(bidulDB);
                };
                request.onerror = () => reject(request.error || new Error('IndexedDB를 열지 못했습니다.'));
                request.onblocked = () => reject(new Error('다른 탭에서 데이터베이스가 열려 있습니다. 다른 BIDUL 탭을 닫고 다시 시도해 주세요.'));
            });
        }

        function dbGet(key) {
            return new Promise((resolve, reject) => {
                if (!bidulDB) return reject(new Error('저장소가 아직 준비되지 않았습니다.'));
                const tx = bidulDB.transaction(BIDUL_STORE_NAME, 'readonly');
                const request = tx.objectStore(BIDUL_STORE_NAME).get(key);
                request.onsuccess = () => resolve(request.result ? request.result.value : undefined);
                request.onerror = () => reject(request.error || new Error('데이터를 읽지 못했습니다.'));
                tx.onerror = () => reject(tx.error || new Error('데이터 읽기 작업에 실패했습니다.'));
            });
        }

        function dbSet(key, value) {
            return new Promise((resolve, reject) => {
                if (!bidulDB) return reject(new Error('저장소가 아직 준비되지 않았습니다.'));
                let tx;
                try {
                    tx = bidulDB.transaction(BIDUL_STORE_NAME, 'readwrite');
                    tx.objectStore(BIDUL_STORE_NAME).put({ key, value });
                } catch (error) {
                    reject(error);
                    return;
                }
                tx.oncomplete = () => resolve();
                tx.onerror = () => reject(tx.error || new Error('데이터 저장에 실패했습니다.'));
                tx.onabort = () => reject(tx.error || new Error('데이터 저장이 취소되었습니다.'));
            });
        }

        function dbDelete(key) {
            return new Promise((resolve, reject) => {
                if (!bidulDB) return reject(new Error('저장소가 아직 준비되지 않았습니다.'));
                const tx = bidulDB.transaction(BIDUL_STORE_NAME, 'readwrite');
                tx.objectStore(BIDUL_STORE_NAME).delete(key);
                tx.oncomplete = () => resolve();
                tx.onerror = () => reject(tx.error || new Error('데이터 삭제에 실패했습니다.'));
                tx.onabort = () => reject(tx.error || new Error('데이터 삭제가 취소되었습니다.'));
            });
        }

        function showStorageError(error) {
            console.error('BIDUL 저장 오류:', error);
            if (error && (error.name === 'QuotaExceededError' || error.name === 'NS_ERROR_DOM_QUOTA_REACHED')) {
                alert('브라우저 저장 공간이 부족해 저장하지 못했습니다. 큰 사진이 포함된 글이나 필요 없는 글을 백업한 뒤 정리하고 다시 시도해 주세요.');
            } else {
                alert('저장에 실패했습니다. 브라우저의 사이트 데이터 차단 여부를 확인하고, 다른 BIDUL 탭을 닫은 뒤 다시 시도해 주세요.');
            }
        }

        async function initializeBidul() {
            if (typeof Ponytail !== 'undefined') {
                try { new Ponytail('#contentEditor'); } catch (error) { console.warn('Ponytail 초기화 실패:', error); }
            }
            try {
                await openBidulDB();

                // 이전 버전의 localStorage 글을 IndexedDB로 한 번 이전합니다.
                let savedPosts = await dbGet('posts');
                const legacyPosts = localStorage.getItem('bidul_posts');
                if (savedPosts === undefined) {
                    if (legacyPosts) {
                        const parsed = JSON.parse(legacyPosts);
                        if (!Array.isArray(parsed)) throw new Error('기존 글 데이터 형식이 올바르지 않습니다.');
                        savedPosts = parsed;
                    } else {
                        savedPosts = [];
                    }
                    await dbSet('posts', savedPosts);
                }
                posts = Array.isArray(savedPosts) ? savedPosts : [];
                // IndexedDB 저장에 성공한 뒤에만 구버전 복사본을 제거합니다.
                if (legacyPosts !== null) localStorage.removeItem('bidul_posts');

                // 이전 버전 임시 저장 데이터도 이전합니다.
                const savedDraft = await dbGet('drafts');
                const legacyDraft = localStorage.getItem('bidul_drafts');
                if (savedDraft === undefined && legacyDraft !== null) {
                    await dbSet('drafts', JSON.parse(legacyDraft));
                    localStorage.removeItem('bidul_drafts');
                }
            } catch (error) {
                console.error('BIDUL 초기화/데이터 이전 오류:', error);
                // 이전 데이터가 있으면 읽기 전용으로라도 목록을 표시합니다.
                try {
                    const legacy = JSON.parse(localStorage.getItem('bidul_posts') || '[]');
                    posts = Array.isArray(legacy) ? legacy : [];
                } catch (_) { posts = []; }
                showToast('저장소 초기화에 문제가 있습니다. 콘솔 오류를 확인해 주세요.');
            }
            renderPosts();
        }

        window.addEventListener('DOMContentLoaded', initializeBidul);

        const editor = document.getElementById('contentEditor');
        
        function saveSelection() {
            if (window.getSelection && window.getSelection().rangeCount > 0) {
                savedRange = window.getSelection().getRangeAt(0);
            }
        }
        function restoreSelection() {
            editor.focus();
            if (savedRange && window.getSelection) {
                try {
                    const sel = window.getSelection();
                    sel.removeAllRanges();
                    sel.addRange(savedRange);
                } catch(e) {}
            }
        }
        editor.addEventListener('keyup', saveSelection);
        editor.addEventListener('mouseup', saveSelection);
        editor.addEventListener('blur', saveSelection);

        // 접기 블록 클릭 시 에디터 포커스 충돌 방지
        editor.addEventListener('click', function(e) {
            const title = e.target.closest('.fold-title');
            const body = e.target.closest('.fold-body');
            if (title || body) e.stopPropagation();
        });

        // 드래그한 위치에 커서를 배치합니다. Chrome/Edge와 Firefox를 모두 지원합니다.
        function saveSelectionAtPoint(x, y) {
            let range = null;
            if (document.caretRangeFromPoint) {
                range = document.caretRangeFromPoint(x, y);
            } else if (document.caretPositionFromPoint) {
                const position = document.caretPositionFromPoint(x, y);
                if (position) {
                    range = document.createRange();
                    range.setStart(position.offsetNode, position.offset);
                    range.collapse(true);
                }
            }
            if (range && editor.contains(range.commonAncestorContainer)) {
                savedRange = range.cloneRange();
                return true;
            }
            return false;
        }

        function isFileDrag(e) {
            return Array.from(e.dataTransfer?.types || []).includes('Files');
        }

        editor.addEventListener('dragenter', (e) => {
            if (!isFileDrag(e)) return;
            e.preventDefault();
            editor.classList.add('drag-over');
        });

        editor.addEventListener('dragover', (e) => {
            if (!isFileDrag(e)) return;
            e.preventDefault();
            if (e.dataTransfer) e.dataTransfer.dropEffect = 'copy';
            editor.classList.add('drag-over');
        });

        editor.addEventListener('dragleave', (e) => {
            if (!editor.contains(e.relatedTarget)) editor.classList.remove('drag-over');
        });

        editor.addEventListener('drop', async (e) => {
            const files = Array.from(e.dataTransfer?.files || []);
            const imageFiles = files.filter(file => file.type.startsWith('image/'));
            if (imageFiles.length === 0) return;

            e.preventDefault();
            e.stopPropagation();
            editor.classList.remove('drag-over');
            const hasDropCaret = saveSelectionAtPoint(e.clientX, e.clientY);
            if (!hasDropCaret) {
                const range = document.createRange();
                range.selectNodeContents(editor);
                range.collapse(false);
                savedRange = range;
            }
            editor.focus();

            let inserted = 0;
            for (const file of imageFiles) {
                try {
                    await insertImageFile(file);
                    inserted++;
                } catch (error) {
                    console.error('이미지 드롭 삽입 오류:', error);
                    showToast(`이미지를 삽입하지 못했습니다: ${file.name}`);
                }
            }
            if (inserted > 0) showToast(`${inserted}개 이미지가 삽입되었습니다.`);
            if (files.length > imageFiles.length) {
                showToast('이미지 파일만 삽입했습니다.');
            }
        });

        // 에디터 바깥에 파일을 놓았을 때 브라우저가 이미지 파일로 이동하는 동작을 방지합니다.
        window.addEventListener('dragover', (e) => {
            if (isFileDrag(e) && !editor.contains(e.target)) e.preventDefault();
        });
        window.addEventListener('drop', (e) => {
            if (isFileDrag(e) && !editor.contains(e.target)) e.preventDefault();
        });

        function toggleMenu(e, menuId) {
            e.stopPropagation();
            const menu = document.getElementById(menuId);
            const isShowing = menu.classList.contains('show');
            document.querySelectorAll('.dropdown').forEach(m => m.classList.remove('show'));
            if (!isShowing) menu.classList.add('show');
        }
        window.onclick = () => document.querySelectorAll('.dropdown').forEach(m => m.classList.remove('show'));

        function toggleDarkMode() {
            const isDark = document.body.classList.toggle('dark-mode');
            localStorage.setItem('bidul_darkmode', isDark);
            showToast(isDark ? "다크모드가 켜졌습니다." : "라이트모드가 켜졌습니다.");
        }

        async function exportCache() {
            try {
                const storedPosts = bidulDB ? await dbGet('posts') : posts;
                const dataStr = JSON.stringify(Array.isArray(storedPosts) ? storedPosts : posts);
                const blob = new Blob([dataStr], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `bidul_backup_${new Date().toISOString().slice(0,10)}.json`;
                document.body.appendChild(a);
                a.click();
                a.remove();
                setTimeout(() => URL.revokeObjectURL(url), 1000);
                showToast('데이터를 다운로드했습니다.');
            } catch (error) {
                showStorageError(error);
            }
        }

        function importCache(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = async function(event) {
                try {
                    const parsedData = JSON.parse(event.target.result);
                    if (!Array.isArray(parsedData)) throw new Error('백업 파일은 글 목록 배열이어야 합니다.');
                    if (!confirm('기존 글이 덮어씌워집니다. 진행하시겠습니까?')) return;
                    await dbSet('posts', parsedData);
                    posts = parsedData;
                    localStorage.removeItem('bidul_posts');
                    try { await dbDelete('drafts'); } catch (_) {}
                    renderPosts();
                    alert('데이터를 성공적으로 불러왔습니다.');
                } catch (error) {
                    if (error instanceof SyntaxError) alert('JSON 파일을 읽을 수 없습니다. 백업 파일이 올바른지 확인해 주세요.');
                    else showStorageError(error);
                } finally {
                    e.target.value = '';
                }
            };
            reader.onerror = () => { alert('파일을 읽지 못했습니다.'); e.target.value = ''; };
            reader.readAsText(file);
        }

        function hideAll() {
            ['homeHeader', 'writeHeader', 'viewHeader', 'homePage', 'writePage', 'viewPage']
                .forEach(id => document.getElementById(id).classList.add('hidden'));
        }

        function goHome() {
            hideAll();
            document.getElementById('homeHeader').classList.remove('hidden');
            document.getElementById('homePage').classList.remove('hidden');
            renderPosts();
        }

        // 새 글 쓰기
        function goWrite() {
            editingPostId = null; // 수정 모드 해제
            hideAll();
            document.getElementById('writeHeader').classList.remove('hidden');
            document.getElementById('writePage').classList.remove('hidden');
            document.getElementById('titleInput').value = '';
            editor.innerHTML = '';
        }

        // 글 보기
        function goView(id) {
            const post = posts.find(p => p.id === id);
            if(!post) return;
            currentViewId = id;
            hideAll();
            document.getElementById('viewHeader').classList.remove('hidden');
            document.getElementById('viewPage').classList.remove('hidden');
            document.getElementById('viewTitle').innerText = post.title;
            document.getElementById('viewDate').innerText = post.date;
            document.getElementById('viewContent').innerHTML = post.content;
        }

        // 글 수정 모드 진입
        function editPost() {
            const post = posts.find(p => p.id === currentViewId);
            if (!post) return;
            
            editingPostId = post.id;
            hideAll();
            document.getElementById('writeHeader').classList.remove('hidden');
            document.getElementById('writePage').classList.remove('hidden');
            
            document.getElementById('titleInput').value = post.title;
            editor.innerHTML = post.content;
        }

        function updateStyle() {
            editor.style.fontFamily = document.getElementById('fontSelect').value;
            editor.style.fontSize = document.getElementById('sizeSelect').value;
        }

        function openLinkModal() { 
            saveSelection();
            document.getElementById('linkModal').classList.add('show'); 
            document.getElementById('linkInput').focus();
        }
        function closeLinkModal() { document.getElementById('linkModal').classList.remove('show'); }

        function insertLink() {
            const url = document.getElementById('linkInput').value;
            if(!url) return;
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            const match = url.match(regExp);
            const videoId = (match && match[2].length === 11) ? match[2] : null;
            restoreSelection();
            if (videoId) {
                const html = `<div class="media-container" contenteditable="false"><iframe src="https://www.youtube.com/embed/${videoId}?enablejsapi=1&origin=${encodeURIComponent(window.location.origin)}" frameborder="0" allowfullscreen></iframe></div><p><br></p>`;
                document.execCommand('insertHTML', false, html);
            } else {
                document.execCommand('createLink', false, url);
            }
            closeLinkModal();
            document.getElementById('linkInput').value = '';
        }

        function insertImage() {
            saveSelection();
            document.getElementById('imageInput').click();
        }

        // 일반 이미지는 최대 1920px로 축소하고 WebP로 압축합니다. 긴 이미지는 해상도를 유지합니다.
        // GIF 애니메이션, 기존 WebP 애니메이션, SVG 벡터는 원본을 유지합니다.
        // 투명도는 WebP 형식에서 유지되며, WebP 미지원 브라우저에서는 PNG로 대체합니다.
        function readFileAsDataURL(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result);
                reader.onerror = () => reject(reader.error || new Error('이미지 파일을 읽지 못했습니다.'));
                reader.readAsDataURL(file);
            });
        }

        async function imageFileToDataURL(file) {
            if (!file || !file.type.startsWith('image/')) {
                throw new Error('이미지 파일이 아닙니다.');
            }
            if (['image/gif', 'image/svg+xml', 'image/webp'].includes(file.type.toLowerCase())) {
                return await readFileAsDataURL(file);
            }

            const objectUrl = URL.createObjectURL(file);
            try {
                const image = new Image();
                image.src = objectUrl;
                if (typeof image.decode === 'function') {
                    await image.decode();
                } else {
                    await new Promise((resolve, reject) => {
                        image.onload = resolve;
                        image.onerror = () => reject(new Error('이미지를 읽지 못했습니다.'));
                    });
                }

                const naturalWidth = image.naturalWidth;
                const naturalHeight = image.naturalHeight;
                const longestSide = Math.max(naturalWidth, naturalHeight);
                const shortestSide = Math.max(1, Math.min(naturalWidth, naturalHeight));
                const aspectRatio = longestSide / shortestSide;

                // 긴 만화/스크롤 이미지(예: 900 x 25000)는 축소하지 않습니다.
                // 일반 사진만 긴 쪽을 1920px까지 줄여 저장 용량을 아낍니다.
                const isLongImage = longestSide > 5000 && aspectRatio >= 3;
                const maxDimension = isLongImage ? 30000 : 1920;
                const scale = Math.min(1, maxDimension / longestSide);
                const width = Math.max(1, Math.round(naturalWidth * scale));
                const height = Math.max(1, Math.round(naturalHeight * scale));
                const canvas = document.createElement('canvas');
                canvas.width = width;
                canvas.height = height;
                const context = canvas.getContext('2d');
                if (!context) throw new Error('이미지 처리 기능을 사용할 수 없습니다.');
                context.drawImage(image, 0, 0, width, height);

                // 긴 이미지의 글자와 선을 보존하기 위해 압축 품질을 높입니다.
                const quality = isLongImage ? 0.94 : 0.84;
                const webpData = canvas.toDataURL('image/webp', quality);
                if (webpData.startsWith('data:image/webp;')) return webpData;
                return canvas.toDataURL('image/png');
            } finally {
                URL.revokeObjectURL(objectUrl);
            }
        }

        async function insertImageFile(file) {
            const dataUrl = await imageFileToDataURL(file);
            restoreSelection();
            const inserted = document.execCommand(
                'insertHTML',
                false,
                `<img src="${dataUrl}" alt=""><p><br></p>`
            );
            if (!inserted) {
                throw new Error('현재 커서 위치에 이미지를 삽입하지 못했습니다.');
            }
            saveSelection();
        }

        async function handleImage(e) {
            const files = Array.from(e.target.files || []);
            try {
                for (const file of files) {
                    try {
                        await insertImageFile(file);
                    } catch (error) {
                        console.error('이미지 삽입 오류:', error);
                        alert(`이미지 '${file.name}'을(를) 삽입하지 못했습니다. 다른 이미지 파일로 다시 시도해 주세요.`);
                    }
                }
            } finally {
                e.target.value = '';
            }
        }

        function insertVideo() { saveSelection(); document.getElementById('videoInput').click(); }
        function handleVideo(e) {
            if (!e.target.files[0]) return;
            const videoUrl = URL.createObjectURL(e.target.files[0]); 
            const html = `<div class="media-container" contenteditable="false"><video src="${videoUrl}" controls></video></div><p><br></p>`;
            restoreSelection();
            document.execCommand('insertHTML', false, html);
            showToast("영상이 삽입되었습니다.");
            e.target.value = '';
        }

        /* ===== 접기/펼치기 블록 (박스 없음) ===== */
        function insertFoldBlock() {
            saveSelection();
            restoreSelection();
            const id = 'fold-' + Date.now();
            const html = `
<details class="fold-block" id="${id}">
  <summary class="fold-header">
    <span class="fold-arrow">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
    </span>
    <span class="fold-title" contenteditable="true" data-placeholder="접기 제목 입력..."></span>
  </summary>
  <div class="fold-body" contenteditable="true"><br></div>
</details>
<p><br></p>`;
            document.execCommand('insertHTML', false, html);
            showToast("접기 기능이 삽입되었습니다.");

            setTimeout(() => {
                const block = document.getElementById(id);
                if (!block) return;
                const titleEl = block.querySelector('.fold-title');
                if (titleEl) {
                    titleEl.focus();
                    const range = document.createRange();
                    const sel = window.getSelection();
                    range.selectNodeContents(titleEl);
                    range.collapse(false);
                    sel.removeAllRanges();
                    sel.addRange(range);
                }
            }, 30);
        }

        async function savePost() {
            const title = document.getElementById('titleInput').value;
            const content = editor.innerHTML;
            try {
                await dbSet('drafts', { title, content, savedAt: new Date().toISOString() });
                localStorage.removeItem('bidul_drafts');
                showToast('임시 저장되었습니다.');
            } catch (error) {
                showStorageError(error);
            }
        }

        async function publishPost() {
            const title = document.getElementById('titleInput').value.trim();
            const content = editor.innerHTML;
            if (!title) return alert('제목을 입력하세요.');

            // 저장이 성공하기 전에는 화면의 기존 글 목록을 변경하지 않습니다.
            let nextPosts;
            const now = new Date().toLocaleDateString();
            if (editingPostId !== null && editingPostId !== undefined) {
                const exists = posts.some(p => p.id === editingPostId);
                if (!exists) return alert('수정할 글을 찾을 수 없습니다. 목록으로 돌아간 뒤 다시 시도해 주세요.');
                nextPosts = posts.map(p => p.id === editingPostId
                    ? { ...p, title, content, date: now }
                    : p);
            } else {
                nextPosts = [...posts, { id: Date.now(), title, content, date: now }];
            }

            try {
                await dbSet('posts', nextPosts);
                posts = nextPosts;
                const wasEditing = editingPostId !== null && editingPostId !== undefined;
                editingPostId = null;
                try { await dbDelete('drafts'); } catch (error) { console.warn('임시 저장 삭제 실패:', error); }
                localStorage.removeItem('bidul_posts');
                localStorage.removeItem('bidul_drafts');
                showToast(wasEditing ? '수정되었습니다.' : '등록되었습니다.');
                goHome();
            } catch (error) {
                showStorageError(error);
            }
        }

        async function deletePost() {
            if (!confirm('정말 삭제하시겠습니까?')) return;
            const nextPosts = posts.filter(p => p.id !== currentViewId);
            try {
                await dbSet('posts', nextPosts);
                posts = nextPosts;
                localStorage.removeItem('bidul_posts');
                showToast('삭제되었습니다.');
                goHome();
            } catch (error) {
                showStorageError(error);
            }
        }

        function renderPosts() {
            const listDiv = document.getElementById('postList');
            listDiv.innerHTML = '';
            if(posts.length === 0) {
                listDiv.innerHTML = "<p style='color:var(--text-muted);'>작성된 글이 없습니다.</p>";
                return;
            }
            posts.forEach((p, i) => { if(!p.id) p.id = Date.now() + i; });
            [...posts].reverse().forEach(p => {
                const item = document.createElement('div');
                item.className = 'post-item';
                item.onclick = () => goView(p.id);
                const plainContent = String(p.content || '').replace(/<[^>]*>?/gm, '');
                const text = plainContent.substring(0, 100);
                item.innerHTML = `<div class="post-title">${escapeHtml(p.title || '(제목 없음)')}</div><div style="font-size:14px; color:var(--text-sub); line-height:1.5; height:42px; overflow:hidden;">${escapeHtml(text)}${plainContent.length > 100 ? '...' : ''}</div>`;
                listDiv.appendChild(item);
            });
        }

        function escapeHtml(text) {
            const d = document.createElement('div');
            d.textContent = text || '';
            return d.innerHTML;
        }

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.innerText = msg; t.style.display = 'block';
            setTimeout(() => t.style.display = 'none', 2000);
        }
    </script>
</body>
</html>
