<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BIDUL - 블로그 에디터</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="icon.png">
    <link rel="apple-touch-icon" href="icon.png">
    <meta name="theme-color" content="#ffffff">
    
    <!-- 구글 폰트 (나눔고딕, Noto Sans KR, 나눔명조) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nanum+Gothic:wght@400;700&family=Nanum+Myeongjo:wght@400;700&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
    
    <!-- Ponytail Plugin -->
    <script src="https://cdn.jsdelivr.net/gh/dietrichgebert/ponytail@main/ponytail.js"></script>

    <style>
        :root {
            --bg-main: #f4f4f4;
            --bg-paper: #ffffff;
            --text-main: #111111;
            --text-sub: #555555;
            --text-muted: #888888;
            --border-light: #eee;
            --border-main: #ddd;
            --border-dark: #333;
            --hover-bg: #eaeaea;
            --btn-pub-bg: #444444;
            --btn-pub-text: #ffffff;
            --shadow: rgba(0,0,0,0.05);
            --modal-overlay: rgba(0, 0, 0, 0.4);
        }

        body.dark-mode {
            --bg-main: #121212;
            --bg-paper: #1e1e1e;
            --text-main: #e0e0e0;
            --text-sub: #aaa;
            --text-muted: #666;
            --border-light: #2c2c2c;
            --border-main: #333;
            --border-dark: #666;
            --hover-bg: #2a2a2a;
            --btn-pub-bg: #555555;
            --btn-pub-text: #ffffff;
            --shadow: rgba(0,0,0,0.3);
            --modal-overlay: rgba(0, 0, 0, 0.7);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            border-radius: 0 !important;
        }

        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        button, input, select {
            font-family: inherit;
            color: inherit;
        }

        /* ---------------- FIXED HEADER (3 ROWS) ---------------- */
        #fixedHeader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background-color: var(--bg-paper);
            border-bottom: 1px solid var(--border-main);
            z-index: 1000;
            box-shadow: 0 2px 5px var(--shadow);
        }

        .header-row {
            display: flex;
            align-items: center;
            padding: 0 20px;
            border-bottom: 1px solid var(--border-light);
        }
        .header-row:last-child {
            border-bottom: none;
        }

        /* ROW 1: Logo & Global Actions */
        .row-1 {
            height: 44px;
            justify-content: space-between;
        }
        .header-logo {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            text-decoration: none;
            color: var(--text-main);
        }
        .header-logo img {
            width: 24px;
            height: 24px;
            object-fit: contain;
        }
        .header-actions {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .btn-hdr {
            background: #e5e5e5;
            border: 1px solid #ccc;
            padding: 5px 12px;
            font-size: 13px;
            cursor: pointer;
            color: #333;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        body.dark-mode .btn-hdr {
            background: #333;
            border: 1px solid #444;
            color: #eee;
        }
        .btn-hdr:hover {
            opacity: 0.85;
        }
        .btn-hdr-publish {
            background: var(--btn-pub-bg);
            border: 1px solid var(--btn-pub-bg);
            color: var(--btn-pub-text);
        }

        /* ROW 2: Media Insertion Buttons */
        .row-2 {
            height: 38px;
            gap: 4px;
            background-color: var(--bg-paper);
        }

        /* ROW 3: Text Formatting Toolbar */
        .row-3 {
            height: 38px;
            gap: 2px;
            background-color: var(--bg-paper);
            overflow-x: auto;
            white-space: nowrap;
        }

        /* Tool Toolbar Elements */
        .tool-btn {
            background: transparent;
            border: 1px solid transparent;
            padding: 4px 8px;
            font-size: 13px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            height: 28px;
            color: var(--text-main);
        }
        .tool-btn:hover {
            background-color: var(--hover-bg);
            border-color: var(--border-main);
        }
        .tool-btn.active {
            background-color: var(--hover-bg);
            font-weight: bold;
            border-color: var(--border-dark);
        }

        .divider {
            width: 1px;
            height: 16px;
            background-color: var(--border-main);
            margin: 0 4px;
        }

        /* Custom Borderless Select Dropdowns */
        .select-wrapper {
            position: relative;
            display: inline-flex;
            align-items: center;
        }
        .select-wrapper select {
            appearance: none;
            -webkit-appearance: none;
            background: transparent;
            border: none;
            padding: 4px 18px 4px 6px;
            font-size: 13px;
            cursor: pointer;
            color: var(--text-main);
            outline: none;
        }
        .select-wrapper select option {
            background-color: var(--bg-paper);
            color: var(--text-main);
        }
        .select-wrapper::after {
            content: '∨';
            position: absolute;
            right: 4px;
            pointer-events: none;
            font-size: 10px;
            color: var(--text-sub);
        }

        /* Three Dots Menu */
        .menu-wrapper {
            position: relative;
            display: inline-block;
        }
        .btn-menu {
            background: transparent;
            border: none;
            padding: 4px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-main);
            width: 32px;
            height: 32px;
        }
        .btn-menu:hover {
            background-color: var(--hover-bg);
        }
        .dropdown-menu {
            display: none;
            position: absolute;
            right: 0;
            top: 100%;
            background-color: var(--bg-paper);
            border: 1px solid var(--border-main);
            box-shadow: 0 4px 10px var(--shadow);
            z-index: 2000;
            min-width: 160px;
        }
        .dropdown-menu.show {
            display: block;
        }
        .dropdown-item {
            padding: 8px 12px;
            font-size: 13px;
            cursor: pointer;
            display: block;
            width: 100%;
            text-align: left;
            background: transparent;
            border: none;
            color: var(--text-main);
        }
        .dropdown-item:hover {
            background-color: var(--hover-bg);
        }

        /* ---------------- PAGE LAYOUT ---------------- */
        #appContainer {
            margin-top: 121px; /* 44px + 38px + 38px + 1px borders */
            flex: 1;
            display: flex;
            justify-content: center;
            padding: 20px 0 60px 0;
        }

        .paper-page {
            width: 820px;
            max-width: 100%;
            background-color: var(--bg-paper);
            min-height: 800px;
            box-shadow: 0 0 10px var(--shadow);
            padding: 40px;
            display: none;
        }
        .paper-page.active {
            display: block;
        }

        /* WRITE PAGE */
        .editor-title-input {
            width: 100%;
            border: none;
            border-bottom: 1px solid var(--border-light);
            font-size: 28px;
            font-weight: bold;
            padding: 10px 0;
            margin-bottom: 20px;
            outline: none;
            background: transparent;
            color: var(--text-main);
        }
        .editor-title-input::placeholder {
            color: var(--text-muted);
        }

        #contentEditor {
            min-height: 600px;
            outline: none;
            font-size: 15px;
            line-height: 1.6;
            color: var(--text-main);
            transition: outline 0.2s ease, background-color 0.2s ease;
        }
        #contentEditor[placeholder]:empty:before {
            content: attr(placeholder);
            color: var(--text-muted);
            cursor: text;
        }
        
        /* Drag and Drop Visual Feedback */
        #contentEditor.drag-over {
            outline: 2px dashed var(--border-dark) !important;
            outline-offset: -4px;
            background-color: rgba(0, 0, 0, 0.02);
        }
        body.dark-mode #contentEditor.drag-over {
            background-color: rgba(255, 255, 255, 0.04);
        }

        /* Media Elements inside Content Editor */
        .editor-img-wrap, .editor-video-wrap, .editor-iframe-wrap {
            margin: 15px 0;
            text-align: center;
        }
        .editor-img-wrap img, .editor-video-wrap video {
            max-width: 100%;
            height: auto;
            display: block;
            margin: 0 auto;
        }
        .editor-iframe-wrap {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            overflow: hidden;
        }
        .editor-iframe-wrap iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Borderless Fold Block ( 접기/펼치기 ) */
        details.fold-block {
            margin: 12px 0;
            padding: 4px 0;
            background: transparent !important;
            border: none !important;
            box-shadow: none !important;
        }
        summary.fold-header {
            list-style: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: bold;
            color: var(--text-main);
            outline: none;
            user-select: none;
            padding: 2px 0;
        }
        summary.fold-header::-webkit-details-marker {
            display: none;
        }
        .fold-arrow {
            display: inline-block;
            transition: transform 0.2s ease;
            font-size: 12px;
            width: 14px;
            text-align: center;
            color: var(--text-sub);
        }
        details[open] > summary .fold-arrow {
            transform: rotate(90deg);
        }
        .fold-title {
            outline: none;
            border-bottom: 1px dashed var(--border-main);
            padding-bottom: 2px;
        }
        .fold-body {
            padding: 8px 0 4px 20px;
            color: var(--text-main);
            outline: none;
        }

        /* HOME PAGE */
        .home-title {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid var(--border-dark);
        }
        .post-list {
            list-style: none;
        }
        .post-item {
            padding: 16px 0;
            border-bottom: 1px solid var(--border-light);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .post-info {
            cursor: pointer;
            flex: 1;
        }
        .post-item-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 6px;
        }
        .post-item-date {
            font-size: 12px;
            color: var(--text-muted);
        }
        .post-item-actions {
            display: flex;
            gap: 6px;
        }

        /* VIEW PAGE */
        .view-title {
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 8px;
        }
        .view-date {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 30px;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--border-light);
        }
        .view-content {
            font-size: 15px;
            line-height: 1.7;
        }

        /* MODAL DIALOGS */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: var(--modal-overlay);
            z-index: 3000;
            align-items: center;
            justify-content: center;
        }
        .modal-overlay.show {
            display: flex;
        }
        .modal-box {
            background-color: var(--bg-paper);
            border: 1px solid var(--border-dark);
            padding: 20px;
            width: 400px;
            max-width: 90%;
            box-shadow: 0 4px 15px var(--shadow);
        }
        .modal-box h3 {
            margin-bottom: 12px;
            font-size: 16px;
        }
        .modal-box input[type="text"] {
            width: 100%;
            padding: 8px;
            border: 1px solid var(--border-main);
            background: var(--bg-main);
            color: var(--text-main);
            margin-bottom: 12px;
            outline: none;
        }
        .modal-btns {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
        }

        /* Hidden inputs */
        input[type="file"] {
            display: none;
        }
    </style>
</head>
<body>

    <!-- ---------------- FIXED HEADER ---------------- -->
    <header id="fixedHeader">
        <!-- ROW 1: Logo & Global Actions -->
        <div class="header-row row-1">
            <a class="header-logo" id="logoBtn">
                <img src="icon.png" alt="BIDUL Logo" onerror="this.style.display='none'">
                <span>BIDUL</span>
            </a>
            <div class="header-actions">
                <!-- Home State Actions -->
                <div id="homeHeaderActions">
                    <button class="btn-hdr btn-hdr-publish" id="navWriteBtn">글쓰기</button>
                </div>
                <!-- Write State Actions -->
                <div id="writeHeaderActions" style="display: none;">
                    <button class="btn-hdr" id="saveDraftBtn">임시저장</button>
                    <button class="btn-hdr btn-hdr-publish" id="publishBtn">발행</button>
                </div>
                <!-- View State Actions -->
                <div id="viewHeaderActions" style="display: none;">
                    <button class="btn-hdr" id="editPostBtn">수정</button>
                    <button class="btn-hdr" id="deletePostBtn">삭제</button>
                    <button class="btn-hdr" id="backToListBtn">목록으로</button>
                </div>

                <!-- Three Dots Dropdown Menu -->
                <div class="menu-wrapper">
                    <button class="btn-menu" id="menuToggleBtn" title="메뉴">
                        <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
                            <circle cx="12" cy="5" r="2"></circle>
                            <circle cx="12" cy="12" r="2"></circle>
                            <circle cx="12" cy="19" r="2"></circle>
                        </svg>
                    </button>
                    <div class="dropdown-menu" id="dropdownMenu">
                        <button class="dropdown-item" id="toggleDarkModeBtn">다크 모드 전환</button>
                        <button class="dropdown-item" id="exportCacheBtn">캐시 백업 (Export)</button>
                        <button class="dropdown-item" id="importCacheBtn">캐시 복원 (Import)</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- ROW 2: Media Tools (Active on Write Page) -->
        <div class="header-row row-2" id="mediaHeaderRow">
            <button class="tool-btn" id="btnInsertPhoto">📷 사진</button>
            <button class="tool-btn" id="btnInsertVideo">🎥 동영상</button>
            <button class="tool-btn" id="btnInsertLink">🔗 링크</button>
            <button class="tool-btn" id="btnInsertFold">▶ 접기/펼치기</button>
            <input type="file" id="photoInput" accept="image/*" multiple>
            <input type="file" id="videoInput" accept="video/*">
        </div>

        <!-- ROW 3: Text Formatting Toolbar -->
        <div class="header-row row-3" id="formatHeaderRow">
            <!-- Font Selection -->
            <div class="select-wrapper">
                <select id="fontSelect" title="폰트 선택">
                    <option value="'Noto Sans KR', sans-serif">Noto Sans KR</option>
                    <option value="'Nanum Gothic', sans-serif">나눔고딕</option>
                    <option value="'Nanum Myeongjo', serif">나눔명조</option>
                </select>
            </div>

            <!-- Font Size -->
            <div class="select-wrapper">
                <select id="fontSizeSelect" title="크기 선택">
                    <option value="13px">13</option>
                    <option value="15px" selected>15</option>
                    <option value="18px">18</option>
                    <option value="20px">20</option>
                    <option value="24px">24</option>
                </select>
            </div>

            <div class="divider"></div>

            <button class="tool-btn" id="btnBold" title="굵게"><b>B</b></button>
            <button class="tool-btn" id="btnItalic" title="기울임"><i>I</i></button>
            <button class="tool-btn" id="btnUnderline" title="밑줄"><u>U</u></button>
            <button class="tool-btn" id="btnStrike" title="취소선"><s>S</s></button>

            <div class="divider"></div>

            <button class="tool-btn" id="btnAlignLeft" title="왼쪽 정렬">Align L</button>
            <button class="tool-btn" id="btnAlignCenter" title="가운데 정렬">Align C</button>
            <button class="tool-btn" id="btnAlignRight" title="오른쪽 정렬">Align R</button>
        </div>
    </header>

    <!-- ---------------- APP MAIN CONTAINER ---------------- -->
    <div id="appContainer">
        <!-- HOME PAGE -->
        <main class="paper-page active" id="homePage">
            <h2 class="home-title">전체 글 목록</h2>
            <ul class="post-list" id="postListContainer">
                <!-- Posts dynamic insertion -->
            </ul>
        </main>

        <!-- WRITE / EDIT PAGE -->
        <main class="paper-page" id="writePage">
            <input type="text" id="postTitleInput" class="editor-title-input" placeholder="제목을 입력하세요">
            <div id="contentEditor" contenteditable="true" placeholder="내용을 입력하세요... (이미지를 여기에 드래그 앤 드롭할 수도 있습니다)"></div>
        </main>

        <!-- VIEW PAGE -->
        <main class="paper-page" id="viewPage">
            <h1 class="view-title" id="viewPostTitle"></h1>
            <div class="view-date" id="viewPostDate"></div>
            <div class="view-content" id="viewPostContent"></div>
        </main>
    </div>

    <!-- Hidden Input for Cache Import -->
    <input type="file" id="importFileInput" accept=".json">

    <!-- Modal Dialog: Link Embedding -->
    <div class="modal-overlay" id="linkModal">
        <div class="modal-box">
            <h3>링크 또는 유튜브 주소 삽입</h3>
            <input type="text" id="linkUrlInput" placeholder="https://...">
            <div class="modal-btns">
                <button class="btn-hdr" id="modalCancelBtn">취소</button>
                <button class="btn-hdr btn-hdr-publish" id="modalConfirmBtn">확인</button>
            </div>
        </div>
    </div>

    <!-- ---------------- SCRIPT LOGIC ---------------- -->
    <script>
        // ---------------- INDEXEDDB STORAGE (대용량 이미지 지원) ----------------
        const DB_NAME = 'BidulDB';
        const DB_VERSION = 1;
        let db;

        function initDB() {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open(DB_NAME, DB_VERSION);
                request.onupgradeneeded = (e) => {
                    db = e.target.result;
                    if (!db.objectStoreNames.contains('posts')) {
                        db.createObjectStore('posts', { keyPath: 'id' });
                    }
                    if (!db.objectStoreNames.contains('drafts')) {
                        db.createObjectStore('drafts', { keyPath: 'id' });
                    }
                };
                request.onsuccess = (e) => {
                    db = e.target.result;
                    resolve(db);
                };
                request.onerror = (e) => reject(e);
            });
        }

        async function getAllPostsDB() {
            return new Promise((resolve) => {
                const tx = db.transaction('posts', 'readonly');
                const store = tx.objectStore('posts');
                const req = store.getAll();
                req.onsuccess = () => resolve(req.result.sort((a,b) => b.id - a.id));
            });
        }

        async function savePostDB(post) {
            return new Promise((resolve) => {
                const tx = db.transaction('posts', 'readwrite');
                const store = tx.objectStore('posts');
                store.put(post);
                tx.oncomplete = () => resolve();
            });
        }

        async function deletePostDB(id) {
            return new Promise((resolve) => {
                const tx = db.transaction('posts', 'readwrite');
                const store = tx.objectStore('posts');
                store.delete(id);
                tx.oncomplete = () => resolve();
            });
        }

        async function saveDraftDB(draft) {
            return new Promise((resolve) => {
                const tx = db.transaction('drafts', 'readwrite');
                const store = tx.objectStore('drafts');
                store.put(draft);
                tx.oncomplete = () => resolve();
            });
        }

        async function getAllDraftsDB() {
            return new Promise((resolve) => {
                const tx = db.transaction('drafts', 'readonly');
                const store = tx.objectStore('drafts');
                const req = store.getAll();
                req.onsuccess = () => resolve(req.result);
            });
        }

        // ---------------- APP LOGIC ----------------
        let currentPostId = null;
        let savedRange = null;

        // Element References
        const homePage = document.getElementById('homePage');
        const writePage = document.getElementById('writePage');
        const viewPage = document.getElementById('viewPage');

        const homeHeaderActions = document.getElementById('homeHeaderActions');
        const writeHeaderActions = document.getElementById('writeHeaderActions');
        const viewHeaderActions = document.getElementById('viewHeaderActions');
        const mediaHeaderRow = document.getElementById('mediaHeaderRow');
        const formatHeaderRow = document.getElementById('formatHeaderRow');

        const postListContainer = document.getElementById('postListContainer');
        const postTitleInput = document.getElementById('postTitleInput');
        const contentEditor = document.getElementById('contentEditor');

        const viewPostTitle = document.getElementById('viewPostTitle');
        const viewPostDate = document.getElementById('viewPostDate');
        const viewPostContent = document.getElementById('viewPostContent');

        const linkModal = document.getElementById('linkModal');
        const linkUrlInput = document.getElementById('linkUrlInput');

        // Initial Initialization
        document.addEventListener('DOMContentLoaded', async () => {
            await initDB();
            initDarkMode();
            await renderPostList();
            routeTo('home');

            // Initialize Ponytail Plugin on Editor
            if (window.Ponytail) {
                new Ponytail('#contentEditor');
            }

            // Bind Drag and Drop Events for Editor
            setupDragAndDrop();
        });

        // Router
        async function routeTo(page, id = null) {
            homePage.classList.remove('active');
            writePage.classList.remove('active');
            viewPage.classList.remove('active');

            homeHeaderActions.style.display = 'none';
            writeHeaderActions.style.display = 'none';
            viewHeaderActions.style.display = 'none';

            currentPostId = id;

            if (page === 'home') {
                homePage.classList.add('active');
                homeHeaderActions.style.display = 'block';
                mediaHeaderRow.style.visibility = 'hidden';
                formatHeaderRow.style.visibility = 'hidden';
                await renderPostList();
            } else if (page === 'write') {
                writePage.classList.add('active');
                writeHeaderActions.style.display = 'block';
                mediaHeaderRow.style.visibility = 'visible';
                formatHeaderRow.style.visibility = 'visible';

                if (id) {
                    const posts = await getAllPostsDB();
                    const post = posts.find(p => p.id === id);
                    if (post) {
                        postTitleInput.value = post.title;
                        contentEditor.innerHTML = post.content;
                    }
                } else {
                    postTitleInput.value = '';
                    contentEditor.innerHTML = '';
                }
            } else if (page === 'view') {
                viewPage.classList.add('active');
                viewHeaderActions.style.display = 'block';
                mediaHeaderRow.style.visibility = 'hidden';
                formatHeaderRow.style.visibility = 'hidden';

                const posts = await getAllPostsDB();
                const post = posts.find(p => p.id === id);
                if (post) {
                    viewPostTitle.textContent = post.title;
                    viewPostDate.textContent = post.date;
                    viewPostContent.innerHTML = post.content;
                }
            }
        }

        // Home View Routing Button Actions
        document.getElementById('logoBtn').addEventListener('click', () => routeTo('home'));
        document.getElementById('navWriteBtn').addEventListener('click', () => routeTo('write'));
        document.getElementById('backToListBtn').addEventListener('click', () => routeTo('home'));

        // Post Operations
        async function renderPostList() {
            const posts = await getAllPostsDB();
            postListContainer.innerHTML = '';
            if (posts.length === 0) {
                postListContainer.innerHTML = '<li style="color:var(--text-muted); padding: 20px 0;">작성된 글이 없습니다.</li>';
                return;
            }
            posts.forEach(post => {
                const li = document.createElement('li');
                li.className = 'post-item';
                li.innerHTML = `
                    <div class="post-info" onclick="routeTo('view', ${post.id})">
                        <div class="post-item-title">${escapeHtml(post.title || '제목 없음')}</div>
                        <div class="post-item-date">${post.date}</div>
                    </div>
                    <div class="post-item-actions">
                        <button class="btn-hdr" onclick="routeTo('write', ${post.id})">수정</button>
                        <button class="btn-hdr" onclick="deletePost(${post.id})">삭제</button>
                    </div>
                `;
                postListContainer.appendChild(li);
            });
        }

        document.getElementById('publishBtn').addEventListener('click', async () => {
            const title = postTitleInput.value.trim();
            const content = contentEditor.innerHTML.trim();

            if (!title && !content) {
                alert('제목이나 내용을 입력해 주세요.');
                return;
            }

            const now = new Date();
            const dateStr = `${now.getFullYear()}.${String(now.getMonth() + 1).padStart(2, '0')}.${String(now.getDate()).padStart(2, '0')} ${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;

            const postObj = {
                id: currentPostId ? currentPostId : Date.now(),
                title: title,
                content: content,
                date: dateStr
            };

            await savePostDB(postObj);
            alert('글이 성공적으로 발행되었습니다.');
            routeTo('home');
        });

        document.getElementById('saveDraftBtn').addEventListener('click', async () => {
            const title = postTitleInput.value.trim();
            const content = contentEditor.innerHTML.trim();
            await saveDraftDB({ id: Date.now(), title, content, date: new Date().toLocaleString() });
            alert('임시 저장이 완료되었습니다.');
        });

        document.getElementById('editPostBtn').addEventListener('click', () => {
            if (currentPostId) routeTo('write', currentPostId);
        });

        document.getElementById('deletePostBtn').addEventListener('click', () => {
            if (currentPostId) deletePost(currentPostId);
        });

        window.deletePost = async function(id) {
            if (confirm('정말로 이 글을 삭제하시겠습니까?')) {
                await deletePostDB(id);
                routeTo('home');
            }
        };

        // ---------------- MEDIA INSERTION ----------------
        document.getElementById('btnInsertPhoto').addEventListener('click', () => {
            document.getElementById('photoInput').click();
        });
        document.getElementById('photoInput').addEventListener('change', (e) => {
            if (e.target.files && e.target.files.length > 0) {
                processImageFiles(Array.from(e.target.files));
                e.target.value = '';
            }
        });

        function processImageFiles(files) {
            files.forEach(file => {
                if (!file.type.startsWith('image/')) return;
                const reader = new FileReader();
                reader.onload = (e) => {
                    const imgHtml = `<div class="editor-img-wrap" contenteditable="false"><img src="${e.target.result}" alt="Uploaded photo"><br></div><p><br></p>`;
                    document.execCommand('insertHTML', false, imgHtml);
                };
                reader.readAsDataURL(file);
            });
        }

        // ---------------- DRAG AND DROP (PC IMAGE DROP) ----------------
        function setupDragAndDrop() {
            ['dragenter', 'dragover'].forEach(eventName => {
                contentEditor.addEventListener(eventName, (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    if (e.dataTransfer.types && Array.from(e.dataTransfer.types).includes('Files')) {
                        contentEditor.classList.add('drag-over');
                    }
                }, false);
            });

            ['dragleave', 'dragend'].forEach(eventName => {
                contentEditor.addEventListener(eventName, (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    contentEditor.classList.remove('drag-over');
                }, false);
            });

            contentEditor.addEventListener('drop', (e) => {
                e.preventDefault();
                e.stopPropagation();
                contentEditor.classList.remove('drag-over');

                const dt = e.dataTransfer;
                if (!dt || !dt.files || dt.files.length === 0) return;

                // Caret Placement at Drop Coordinates
                let range = null;
                if (document.caretRangeFromPoint) {
                    range = document.caretRangeFromPoint(e.clientX, e.clientY);
                } else if (document.caretPositionFromPoint) {
                    const pos = document.caretPositionFromPoint(e.clientX, e.clientY);
                    if (pos) {
                        range = document.createRange();
                        range.setStart(pos.offsetNode, pos.offset);
                        range.collapse(true);
                    }
                }

                if (range) {
                    const sel = window.getSelection();
                    sel.removeAllRanges();
                    sel.addRange(range);
                }

                const imageFiles = Array.from(dt.files).filter(file => file.type.startsWith('image/'));
                if (imageFiles.length > 0) {
                    processImageFiles(imageFiles);
                }
            }, false);
        }

        // Video Insertion
        document.getElementById('btnInsertVideo').addEventListener('click', () => {
            document.getElementById('videoInput').click();
        });
        document.getElementById('videoInput').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const videoUrl = URL.createObjectURL(file);
                const videoHtml = `<div class="editor-video-wrap" contenteditable="false"><video src="${videoUrl}" controls></video><br></div><p><br></p>`;
                document.execCommand('insertHTML', false, videoHtml);
            }
            e.target.value = '';
        });

        // Link Insertion
        document.getElementById('btnInsertLink').addEventListener('click', () => {
            saveSelection();
            linkUrlInput.value = '';
            linkModal.classList.add('show');
            linkUrlInput.focus();
        });

        document.getElementById('modalCancelBtn').addEventListener('click', () => {
            linkModal.classList.remove('show');
        });

        document.getElementById('modalConfirmBtn').addEventListener('click', () => {
            const url = linkUrlInput.value.trim();
            linkModal.classList.remove('show');
            restoreSelection();

            if (!url) return;

            // Check YouTube URL
            const ytReg = /(?:youtube\.com\/(?:[^\/]+\/.+\/|(?:v|e(?:mbed)?)\/|.*[?&]v=)|youtu\.be\/)([^"&?\/\s]{11})/;
            const match = url.match(ytReg);

            if (match && match[1]) {
                const videoId = match[1];
                const origin = encodeURIComponent(window.location.origin);
                const iframeHtml = `<div class="editor-iframe-wrap" contenteditable="false"><iframe src="https://www.youtube.com/embed/${videoId}?enablejsapi=1&origin=${origin}" allowfullscreen></iframe></div><p><br></p>`;
                document.execCommand('insertHTML', false, iframeHtml);
            } else {
                const linkHtml = `<a href="${url}" target="_blank" rel="noopener noreferrer">${url}</a>&nbsp;`;
                document.execCommand('insertHTML', false, linkHtml);
            }
        });

        // Borderless Fold Block Insertion ( 접기/펼치기 )
        document.getElementById('btnInsertFold').addEventListener('click', () => {
            const foldId = 'fold_' + Date.now();
            const foldHtml = `
                <details class="fold-block" id="${foldId}">
                    <summary class="fold-header" contenteditable="false">
                        <span class="fold-arrow">▶</span>
                        <span class="fold-title" contenteditable="true" placeholder="접기/펼치기 제목">접기/펼치기 제목 입력</span>
                    </summary>
                    <div class="fold-body" contenteditable="true">
                        <p>내용을 입력하세요...</p>
                    </div>
                </details>
                <p><br></p>
            `;
            document.execCommand('insertHTML', false, foldHtml);
        });

        // Selection Save / Restore Helpers
        function saveSelection() {
            const sel = window.getSelection();
            if (sel.getRangeAt && sel.rangeCount) {
                savedRange = sel.getRangeAt(0);
            }
        }
        function restoreSelection() {
            if (savedRange) {
                const sel = window.getSelection();
                sel.removeAllRanges();
                sel.addRange(savedRange);
            }
        }

        // ---------------- FORMATTING COMMANDS ----------------
        document.getElementById('btnBold').addEventListener('click', () => document.execCommand('bold'));
        document.getElementById('btnItalic').addEventListener('click', () => document.execCommand('italic'));
        document.getElementById('btnUnderline').addEventListener('click', () => document.execCommand('underline'));
        document.getElementById('btnStrike').addEventListener('click', () => document.execCommand('strikeThrough'));
        document.getElementById('btnAlignLeft').addEventListener('click', () => document.execCommand('justifyLeft'));
        document.getElementById('btnAlignCenter').addEventListener('click', () => document.execCommand('justifyCenter'));
        document.getElementById('btnAlignRight').addEventListener('click', () => document.execCommand('justifyRight'));

        document.getElementById('fontSelect').addEventListener('change', (e) => {
            document.execCommand('fontName', false, e.target.value);
        });

        document.getElementById('fontSizeSelect').addEventListener('change', (e) => {
            const size = e.target.value;
            const sel = window.getSelection();
            if (sel.rangeCount) {
                const range = sel.getRangeAt(0);
                const span = document.createElement('span');
                span.style.fontSize = size;
                range.surroundContents(span);
            }
        });

        // ---------------- THREE DOTS MENU & FEATURES ----------------
        const menuToggleBtn = document.getElementById('menuToggleBtn');
        const dropdownMenu = document.getElementById('dropdownMenu');

        menuToggleBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            dropdownMenu.classList.toggle('show');
        });
        document.addEventListener('click', () => dropdownMenu.classList.remove('show'));

        // Dark Mode Toggle
        const toggleDarkModeBtn = document.getElementById('toggleDarkModeBtn');
        function initDarkMode() {
            const isDark = localStorage.getItem('bidul_darkmode') === 'true';
            if (isDark) document.body.classList.add('dark-mode');
        }
        toggleDarkModeBtn.addEventListener('click', () => {
            document.body.classList.toggle('dark-mode');
            const isDark = document.body.classList.contains('dark-mode');
            localStorage.setItem('bidul_darkmode', isDark);
        });

        // Cache Export (JSON from IndexedDB)
        document.getElementById('exportCacheBtn').addEventListener('click', async () => {
            const posts = await getAllPostsDB();
            const drafts = await getAllDraftsDB();
            const cacheData = {
                posts: posts,
                drafts: drafts,
                exportDate: new Date().toISOString()
            };
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(cacheData, null, 2));
            const dlAnchor = document.createElement('a');
            dlAnchor.setAttribute("href", dataStr);
            dlAnchor.setAttribute("download", `bidul_backup_${Date.now()}.json`);
            document.body.appendChild(dlAnchor);
            dlAnchor.click();
            dlAnchor.remove();
        });

        // Cache Import (JSON to IndexedDB)
        const importFileInput = document.getElementById('importFileInput');
        document.getElementById('importCacheBtn').addEventListener('click', () => {
            importFileInput.click();
        });
        importFileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = async (evt) => {
                try {
                    const imported = JSON.parse(evt.target.result);
                    if (imported.posts && Array.isArray(imported.posts)) {
                        for (const post of imported.posts) {
                            await savePostDB(post);
                        }
                    }
                    if (imported.drafts && Array.isArray(imported.drafts)) {
                        for (const draft of imported.drafts) {
                            await saveDraftDB(draft);
                        }
                    }
                    alert('성공적으로 데이터를 복원했습니다.');
                    await renderPostList();
                } catch (err) {
                    alert('올바르지 않은 JSON 데이터 파일입니다.');
                }
            };
            reader.readAsText(file);
            e.target.value = '';
        });

        // Utility: HTML Escaping
        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        // PWA ServiceWorker Registration
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').catch(console.error);
            });
        }
    </script>
</body>
</html>
