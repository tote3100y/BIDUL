<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BIDUL - 고용량 블로그 에디터</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="icon.png">
    <link rel="apple-touch-icon" href="icon.png">
    <meta name="theme-color" content="#ffffff">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nanum+Gothic:wght@400;700&family=Nanum+Myeongjo:wght@400;700&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
    
    <script src="https://cdn.jsdelivr.net/gh/dietrichgebert/ponytail@main/ponytail.js"></script>

    <style>
        :root {
            --bg-main: #f4f4f4;
            --bg-paper: #ffffff;
            --text-main: #111111;
            --text-sub: #555555;
            --text-muted: #888888;
            --border-light: #eee;
            --border-main: #ddd;
            --border-dark: #333;
            --hover-bg: #eaeaea;
            --btn-pub-bg: #444444;
            --btn-pub-text: #ffffff;
            --shadow: rgba(0,0,0,0.05);
            --modal-overlay: rgba(0, 0, 0, 0.4);
        }

        body.dark-mode {
            --bg-main: #121212;
            --bg-paper: #1e1e1e;
            --text-main: #e0e0e0;
            --text-sub: #aaa;
            --text-muted: #666;
            --border-light: #2c2c2c;
            --border-main: #333;
            --border-dark: #666;
            --hover-bg: #2a2a2a;
            --btn-pub-bg: #555555;
            --btn-pub-text: #ffffff;
            --shadow: rgba(0,0,0,0.3);
            --modal-overlay: rgba(0, 0, 0, 0.7);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; border-radius: 0 !important; }

        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        button, input, select { font-family: inherit; color: inherit; }

        /* HEADER */
        #fixedHeader {
            position: fixed; top: 0; left: 0; width: 100%;
            background-color: var(--bg-paper);
            border-bottom: 1px solid var(--border-main);
            z-index: 1000;
            box-shadow: 0 2px 5px var(--shadow);
        }
        .header-row { display: flex; align-items: center; padding: 0 20px; border-bottom: 1px solid var(--border-light); }
        .row-1 { height: 44px; justify-content: space-between; }
        .row-2, .row-3 { height: 38px; gap: 4px; background-color: var(--bg-paper); }
        .row-3 { overflow-x: auto; white-space: nowrap; }

        .header-logo { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 16px; cursor: pointer; text-decoration: none; color: var(--text-main); }
        .header-logo img { width: 24px; height: 24px; object-fit: contain; }
        
        .btn-hdr { background: #e5e5e5; border: 1px solid #ccc; padding: 5px 12px; font-size: 13px; cursor: pointer; color: #333; font-weight: 500; }
        body.dark-mode .btn-hdr { background: #333; border: 1px solid #444; color: #eee; }
        .btn-hdr-publish { background: var(--btn-pub-bg); border: 1px solid var(--btn-pub-bg); color: var(--btn-pub-text); }
        
        .tool-btn { background: transparent; border: 1px solid transparent; padding: 4px 8px; font-size: 13px; cursor: pointer; height: 28px; }
        .tool-btn:hover { background-color: var(--hover-bg); border-color: var(--border-main); }
        .divider { width: 1px; height: 16px; background-color: var(--border-main); margin: 0 4px; }

        /* SELECT */
        .select-wrapper { position: relative; display: inline-flex; align-items: center; }
        .select-wrapper select { appearance: none; background: transparent; border: none; padding: 4px 18px 4px 6px; font-size: 13px; cursor: pointer; outline: none; }
        .select-wrapper::after { content: '∨'; position: absolute; right: 4px; font-size: 10px; color: var(--text-sub); pointer-events: none; }

        /* MAIN LAYOUT */
        #appContainer { margin-top: 121px; flex: 1; display: flex; justify-content: center; padding: 20px 0 60px 0; }
        .paper-page { width: 820px; max-width: 100%; background-color: var(--bg-paper); min-height: 800px; box-shadow: 0 0 10px var(--shadow); padding: 40px; display: none; }
        .paper-page.active { display: block; }

        /* EDITOR */
        .editor-title-input { width: 100%; border: none; border-bottom: 1px solid var(--border-light); font-size: 28px; font-weight: bold; padding: 10px 0; margin-bottom: 20px; outline: none; background: transparent; color: var(--text-main); }
        #contentEditor { min-height: 600px; outline: none; font-size: 15px; line-height: 1.6; }
        #contentEditor[placeholder]:empty:before { content: attr(placeholder); color: var(--text-muted); }
        #contentEditor.drag-over { outline: 2px dashed var(--border-dark); background-color: rgba(0,0,0,0.02); }

        .editor-img-wrap, .editor-video-wrap { margin: 15px 0; text-align: center; }
        .editor-img-wrap img { max-width: 100%; height: auto; display: block; margin: 0 auto; }
        .editor-video-wrap video { max-width: 100%; }

        /* FOLD BLOCK */
        details.fold-block { margin: 12px 0; }
        summary.fold-header { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 6px; font-weight: bold; outline: none; }
        .fold-arrow { transition: transform 0.2s; font-size: 12px; color: var(--text-sub); }
        details[open] > summary .fold-arrow { transform: rotate(90deg); }
        .fold-title { border-bottom: 1px dashed var(--border-main); }
        .fold-body { padding: 8px 0 4px 20px; outline: none; }

        /* LIST & VIEW */
        .post-item { padding: 16px 0; border-bottom: 1px solid var(--border-light); display: flex; justify-content: space-between; align-items: center; }
        .view-title { font-size: 28px; font-weight: bold; margin-bottom: 30px; border-bottom: 1px solid var(--border-light); padding-bottom: 10px; }
        
        /* DROPDOWN MENU */
        .menu-wrapper { position: relative; }
        .dropdown-menu { display: none; position: absolute; right: 0; top: 100%; background: var(--bg-paper); border: 1px solid var(--border-main); min-width: 150px; z-index: 2000; }
        .dropdown-menu.show { display: block; }
        .dropdown-item { padding: 10px; font-size: 13px; cursor: pointer; width: 100%; text-align: left; border: none; background: transparent; }
        .dropdown-item:hover { background: var(--hover-bg); }

        .modal-overlay { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background: var(--modal-overlay); z-index:3000; align-items:center; justify-content:center; }
        .modal-overlay.show { display: flex; }
        .modal-box { background: var(--bg-paper); padding: 20px; width: 400px; }
    </style>
</head>
<body>

    <header id="fixedHeader">
        <div class="header-row row-1">
            <a class="header-logo" id="logoBtn">
                <img src="icon.png" alt="Logo">
                <span>BIDUL</span>
            </a>
            <div class="header-actions">
                <div id="homeHeaderActions"><button class="btn-hdr btn-hdr-publish" id="navWriteBtn">글쓰기</button></div>
                <div id="writeHeaderActions" style="display:none;">
                    <button class="btn-hdr" id="saveDraftBtn">임시저장</button>
                    <button class="btn-hdr btn-hdr-publish" id="publishBtn">발행</button>
                </div>
                <div id="viewHeaderActions" style="display:none;">
                    <button class="btn-hdr" id="editPostBtn">수정</button>
                    <button class="btn-hdr" id="deletePostBtn">삭제</button>
                    <button class="btn-hdr" id="backToListBtn">목록으로</button>
                </div>
                <div class="menu-wrapper">
                    <button class="tool-btn" id="menuToggleBtn">
                        <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><circle cx="12" cy="5" r="2"></circle><circle cx="12" cy="12" r="2"></circle><circle cx="12" cy="19" r="2"></circle></svg>
                    </button>
                    <div class="dropdown-menu" id="dropdownMenu">
                        <button class="dropdown-item" id="toggleDarkModeBtn">다크 모드</button>
                        <button class="dropdown-item" id="exportCacheBtn">백업 (Export)</button>
                        <button class="dropdown-item" id="importCacheBtn">복원 (Import)</button>
                    </div>
                </div>
            </div>
        </div>
        <div class="header-row row-2" id="mediaHeaderRow">
            <button class="tool-btn" id="btnInsertPhoto">📷 사진</button>
            <button class="tool-btn" id="btnInsertVideo">🎥 동영상</button>
            <button class="tool-btn" id="btnInsertLink">🔗 링크</button>
            <button class="tool-btn" id="btnInsertFold">▶ 접기</button>
            <input type="file" id="photoInput" accept="image/*" multiple>
            <input type="file" id="videoInput" accept="video/*">
        </div>
        <div class="header-row row-3" id="formatHeaderRow">
            <div class="select-wrapper">
                <select id="fontSelect">
                    <option value="'Noto Sans KR'">Noto Sans KR</option>
                    <option value="'Nanum Gothic'">나눔고딕</option>
                    <option value="'Nanum Myeongjo'">나눔명조</option>
                </select>
            </div>
            <div class="select-wrapper">
                <select id="fontSizeSelect">
                    <option value="13px">13</option><option value="15px" selected>15</option><option value="18px">18</option><option value="24px">24</option>
                </select>
            </div>
            <div class="divider"></div>
            <button class="tool-btn" onclick="document.execCommand('bold')"><b>B</b></button>
            <button class="tool-btn" onclick="document.execCommand('italic')"><i>I</i></button>
            <button class="tool-btn" onclick="document.execCommand('underline')"><u>U</u></button>
            <div class="divider"></div>
            <button class="tool-btn" onclick="document.execCommand('justifyLeft')">L</button>
            <button class="tool-btn" onclick="document.execCommand('justifyCenter')">C</button>
        </div>
    </header>

    <div id="appContainer">
        <main class="paper-page active" id="homePage">
            <h2 style="margin-bottom:20px;">전체 글</h2>
            <ul id="postListContainer" class="post-list"></ul>
        </main>
        <main class="paper-page" id="writePage">
            <input type="text" id="postTitleInput" class="editor-title-input" placeholder="제목">
            <div id="contentEditor" contenteditable="true" placeholder="이미지를 드래그해서 넣으세요..."></div>
        </main>
        <main class="paper-page" id="viewPage">
            <h1 id="viewPostTitle" class="view-title"></h1>
            <div id="viewPostContent"></div>
        </main>
    </div>

    <div class="modal-overlay" id="linkModal">
        <div class="modal-box">
            <h3>링크 삽입</h3>
            <input type="text" id="linkUrlInput" style="width:100%; margin:10px 0; padding:8px;">
            <div style="text-align:right;">
                <button class="btn-hdr" id="modalCancelBtn">취소</button>
                <button class="btn-hdr btn-hdr-publish" id="modalConfirmBtn">확인</button>
            </div>
        </div>
    </div>

    <script>
        /** IndexedDB Wrapper for Large Data **/
        const dbName = "BidulDB";
        const storeName = "posts";
        let db;

        async function initDB() {
            return new Promise((resolve) => {
                const request = indexedDB.open(dbName, 1);
                request.onupgradeneeded = (e) => {
                    db = e.target.result;
                    db.createObjectStore(storeName, { keyPath: "id" });
                };
                request.onsuccess = (e) => {
                    db = e.target.result;
                    resolve();
                };
            });
        }

        async function getAllPosts() {
            return new Promise((resolve) => {
                const tx = db.transaction(storeName, "readonly");
                const store = tx.objectStore(storeName);
                const request = store.getAll();
                request.onsuccess = () => resolve(request.result.sort((a,b) => b.id - a.id));
            });
        }

        async function savePost(post) {
            return new Promise((resolve) => {
                const tx = db.transaction(storeName, "readwrite");
                const store = tx.objectStore(storeName);
                store.put(post);
                tx.oncomplete = () => resolve();
            });
        }

        async function deletePostFromDB(id) {
            return new Promise((resolve) => {
                const tx = db.transaction(storeName, "readwrite");
                const store = tx.objectStore(storeName);
                store.delete(id);
                tx.oncomplete = () => resolve();
            });
        }

        // Logic
        let currentPostId = null;
        let savedRange = null;

        const homePage = document.getElementById('homePage');
        const writePage = document.getElementById('writePage');
        const viewPage = document.getElementById('viewPage');
        const contentEditor = document.getElementById('contentEditor');
        const postListContainer = document.getElementById('postListContainer');

        window.onload = async () => {
            await initDB();
            if(localStorage.getItem('bidul_darkmode') === 'true') document.body.classList.add('dark-mode');
            new Ponytail('#contentEditor');
            setupDragAndDrop();
            routeTo('home');
        };

        async function routeTo(page, id = null) {
            homePage.classList.remove('active');
            writePage.classList.remove('active');
            viewPage.classList.remove('active');
            
            document.getElementById('homeHeaderActions').style.display = 'none';
            document.getElementById('writeHeaderActions').style.display = 'none';
            document.getElementById('viewHeaderActions').style.display = 'none';
            document.getElementById('mediaHeaderRow').style.visibility = 'hidden';
            document.getElementById('formatHeaderRow').style.visibility = 'hidden';

            currentPostId = id;

            if (page === 'home') {
                homePage.classList.add('active');
                document.getElementById('homeHeaderActions').style.display = 'block';
                renderList();
            } else if (page === 'write') {
                writePage.classList.add('active');
                document.getElementById('writeHeaderActions').style.display = 'block';
                document.getElementById('mediaHeaderRow').style.visibility = 'visible';
                document.getElementById('formatHeaderRow').style.visibility = 'visible';
                if (id) {
                    const posts = await getAllPosts();
                    const p = posts.find(x => x.id === id);
                    document.getElementById('postTitleInput').value = p.title;
                    contentEditor.innerHTML = p.content;
                } else {
                    document.getElementById('postTitleInput').value = '';
                    contentEditor.innerHTML = '';
                }
            } else if (page === 'view') {
                viewPage.classList.add('active');
                document.getElementById('viewHeaderActions').style.display = 'block';
                const posts = await getAllPosts();
                const p = posts.find(x => x.id === id);
                document.getElementById('viewPostTitle').textContent = p.title;
                document.getElementById('viewPostContent').innerHTML = p.content;
            }
        }

        async function renderList() {
            const posts = await getAllPosts();
            postListContainer.innerHTML = posts.length ? '' : '<li>작성된 글이 없습니다.</li>';
            posts.forEach(p => {
                const li = document.createElement('li');
                li.className = 'post-item';
                li.innerHTML = `
                    <div style="cursor:pointer" onclick="routeTo('view', ${p.id})">
                        <strong>${p.title || '제목 없음'}</strong><br><small>${p.date}</small>
                    </div>
                    <button class="btn-hdr" onclick="deleteItem(${p.id})">삭제</button>
                `;
                postListContainer.appendChild(li);
            });
        }

        window.deleteItem = async (id) => {
            if(confirm('삭제할까요?')) {
                await deletePostFromDB(id);
                routeTo('home');
            }
        };

        document.getElementById('publishBtn').onclick = async () => {
            const title = document.getElementById('postTitleInput').value;
            const content = contentEditor.innerHTML;
            const id = currentPostId || Date.now();
            const date = new Date().toLocaleString();
            await savePost({ id, title, content, date });
            alert('발행되었습니다.');
            routeTo('home');
        };

        // Media & Formatting Handlers
        document.getElementById('logoBtn').onclick = () => routeTo('home');
        document.getElementById('navWriteBtn').onclick = () => routeTo('write');
        document.getElementById('backToListBtn').onclick = () => routeTo('home');
        document.getElementById('editPostBtn').onclick = () => routeTo('write', currentPostId);
        document.getElementById('deletePostBtn').onclick = () => deleteItem(currentPostId);

        document.getElementById('btnInsertPhoto').onclick = () => document.getElementById('photoInput').click();
        document.getElementById('photoInput').onchange = (e) => processFiles(e.target.files);

        function processFiles(files) {
            Array.from(files).forEach(file => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const html = `<div class="editor-img-wrap" contenteditable="false"><img src="${e.target.result}"><br></div><p><br></p>`;
                    document.execCommand('insertHTML', false, html);
                };
                reader.readAsDataURL(file);
            });
        }

        function setupDragAndDrop() {
            contentEditor.ondragover = (e) => { e.preventDefault(); contentEditor.classList.add('drag-over'); };
            contentEditor.ondragleave = () => contentEditor.classList.remove('drag-over');
            contentEditor.ondrop = (e) => {
                e.preventDefault();
                contentEditor.classList.remove('drag-over');
                processFiles(e.dataTransfer.files);
            };
        }

        // Font & Size
        document.getElementById('fontSelect').onchange = (e) => document.execCommand('fontName', false, e.target.value);
        document.getElementById('fontSizeSelect').onchange = (e) => {
            const sel = window.getSelection();
            if(sel.rangeCount) {
                const span = document.createElement('span');
                span.style.fontSize = e.target.value;
                sel.getRangeAt(0).surroundContents(span);
            }
        };

        // Fold Block
        document.getElementById('btnInsertFold').onclick = () => {
            const html = `<details class="fold-block"><summary class="fold-header" contenteditable="false"><span class="fold-arrow">▶</span><span class="fold-title" contenteditable="true">제목 입력</span></summary><div class="fold-body" contenteditable="true"><p>내용...</p></div></details><p><br></p>`;
            document.execCommand('insertHTML', false, html);
        };

        // Menu Toggle
        document.getElementById('menuToggleBtn').onclick = (e) => { e.stopPropagation(); document.getElementById('dropdownMenu').classList.toggle('show'); };
        document.onclick = () => document.getElementById('dropdownMenu').classList.remove('show');
        document.getElementById('toggleDarkModeBtn').onclick = () => {
            document.body.classList.toggle('dark-mode');
            localStorage.setItem('bidul_darkmode', document.body.classList.contains('dark-mode'));
        };
    </script>
</body>
</html>
